name: Alden fail-closed voice completion
on:
  push:
    branches: [codex/alden-voice-completion-ci-20261011]
permissions:
  contents: read
jobs:
  local-voice-boundary:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Pin source commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Model wire, one-turn attribution, abort and persistent history tests
        run: >-
          python3 -B -m unittest -v
          tests.test_alden_voice_completion
          tests.test_alden_voice_turns
          tests.test_alden_voice_metrics
          tests.test_alden_voice_model_selection
          tests.test_alden_voice_bargein
          tests.test_alden_routed_llm
